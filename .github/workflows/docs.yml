# Build the documentation on every push / PR, with warnings treated as errors.
# The published site is built and hosted by Read the Docs (.readthedocs.yaml);
# this job only makes sure a change cannot break the docs.
name: Documentation

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation requirements
        run: python -m pip install -r docs/requirements.txt

      - name: Build HTML (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html/
